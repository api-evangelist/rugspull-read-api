description: >-
  Rugspull publishes NO numeric rate limit and returns NO rate-limit headers. This is
  a stated position, not an undocumented gap — four separate first-party documents say
  so in the same words. The provider substitutes a client-side instruction (cache
  responsibly, use exponential backoff) for a server-side signal.
