responseCodes:
  throttled: null
  note: >-
    No 429 is declared in the OpenAPI on any of the nine operations and none was
    observed. The only failure statuses in the contract are 400, 404 and 503.
enforcement:
  documented: false
  note: >-
    The API sits behind Cloudflare, so an undocumented edge protection layer may exist
    (the CORS preflight advertises cf-turnstile-response and x-turnstile-token headers
    for the app's own write surface). Nothing about that is published for the read API,
    so an integrator cannot distinguish "no limit" from "an unstated limit enforced by
    the edge". That ambiguity is the finding.
agent_impact: >-
  An autonomous consumer has no runtime backpressure signal at all: no quota headers to
  read before exhaustion, no 429 to catch, no Retry-After to obey. Correct behaviour has
  to be inferred from prose in a GitHub markdown file. Publishing RFC 9331 RateLimit
  headers and a 429 response — even with generous values — would cost nothing and is the
  cheapest agent-readiness improvement available to this provider.
