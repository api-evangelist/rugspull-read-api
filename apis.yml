name: Rugspull Read API
description: A read-only, GET-only discovery-cache REST API for Rugspull, a self-described high-risk parody DeFi protocol
  on BNB Smart Chain (chain id 56). Exposes rebuildable discovery/indexed-event data with no write, settlement, or
  transaction-proxy operations; on-chain BSC contracts remain the source of financial truth. Unauthenticated, free,
  best-effort, with no published rate limits or SLA.
