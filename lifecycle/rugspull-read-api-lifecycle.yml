versioning:
  scheme: semver-document-version
  current: 0.4.0
  in_path: false
  in_header: false
  media_type_versioning: false
  note: >-
    info.version 0.4.0 matches the monorepo package version and the v0.4.0-evidence.1
    GitHub prerelease tag, so the spec version and the software version move together.
    The wire contract carries no version at all: no /v1 path segment, no version
    header, no versioned media type. A consumer cannot pin, and a breaking change
    would arrive unannounced. The API is also pre-1.0 by its own numbering, which the
    provider does not contradict anywhere.
changelog:
  url: https://github.com/pqchase/rugspull/releases
  format: github-releases
  dated: true
